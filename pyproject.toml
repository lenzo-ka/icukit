[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icukit"
dynamic = ["version"]
description = "ICU toolkit - library and CLI for Unicode and internationalization"
authors = [
    {name = "Kevin Lenzo", email = "kevinlenzo@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["icu", "unicode", "i18n", "internationalization", "localization", "text", "collation", "formatting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
]
dependencies = [
    "icukit-pyicu>=78.2.1; sys_platform == 'darwin'",
    "PyICU>=2.0; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/lenzo-ka/icukit"
Repository = "https://github.com/lenzo-ka/icukit"
Issues = "https://github.com/lenzo-ka/icukit/issues"

[project.optional-dependencies]
bundled = [
    "icukit-pyicu>=78.2.1",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
]

[project.scripts]
icukit = "icukit.cli:main"
ik = "icukit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "icukit.__version__"}

[tool.setuptools.packages.find]
include = ["icukit*"]

[tool.setuptools.package-data]
icukit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# UP (pyupgrade) is enabled in a later pass once `from __future__ import annotations`
# is added across the tree; enabling it now would flag ~150 not-yet-converted hints.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
