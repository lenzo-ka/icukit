[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icukit"
dynamic = ["version"]
description = "ICU toolkit - library and CLI for Unicode and internationalization"
authors = [
    {name = "Kevin Lenzo", email = "kevinlenzo@gmail.com"}
]
license = "BSD-2-Clause AND CC-BY-SA-4.0 AND Unicode-3.0"
# List the root license and every third-party notice that must ship in both the wheel
# and sdist. These must be literal paths, not globs. PROVENANCE.json hash-pins each
# notice, maps it to its SPDX ID, and maps each file under icukit/data to its notice.
license-files = [
    "LICENSE",
    "icukit/data/break_rules/en/LICENSE",
    "icukit/data/break_rules/en/NOTICE",
    "icukit/data/cldr_symbols/LICENSE",
    "icukit/data/ucd_name_aliases/LICENSE",
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["icu", "unicode", "i18n", "internationalization", "localization", "text", "collation", "formatting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
]
# icukit-pyicu bundles pre-built ICU libraries and PyICU, and now ships
# manylinux wheels as well as macOS wheels, so it is the single default
# backend on every supported platform. Both it and system PyICU provide the
# same importable `icu` module.
#
# The floor is deliberate and stays a floor. The detector conformance golden is
# recorded against one exact ICU, and the temptation is to cap this dependency so
# the recorded version can never be overtaken -- but a runtime cap would hold every
# downstream consumer at our golden's ICU for a reason that is entirely ours, and
# it would also stop CI from ever meeting a newer ICU, so the golden would go stale
# with nothing to say so. The version claim is enforced in the test suite instead:
# tests/test_conformance.py fails the build when the golden does not record the
# running ICU. A newer ICU reaching CI is meant to turn CI red, and that red is the
# notice to regenerate the golden.
dependencies = [
    "cartlet>=0.8",
    "icukit-pyicu>=78.3.1",
]

[project.urls]
Homepage = "https://github.com/lenzo-ka/icukit"
Repository = "https://github.com/lenzo-ka/icukit"
Issues = "https://github.com/lenzo-ka/icukit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
    # Used only by the test suite to validate authored abbreviation lexicons
    # against their RELAX NG grammar. The runtime loader stays lxml-free.
    "lxml>=5.0",
    # Used only by the test suite to build the wheel and sdist and check what ships.
    "build>=1.0",
    # Tiergraph requires Python >= 3.12, while icukit also supports Python 3.11.
    # A floor without a cap, so a tiergraph release that breaks icukit's tests
    # breaks them where it can be seen.
    "tiergraph>=0.2; python_version >= '3.12'",
]

[project.scripts]
icukit = "icukit.cli:main"
ik = "icukit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "icukit.__version__"}

[tool.setuptools.packages.find]
include = ["icukit*"]
exclude = ["eval*"]

[tool.setuptools.package-data]
icukit = [
    "py.typed",
    "data/abbreviations/*.xml",
    "data/abbreviations/*.rng",
    "data/exceptions/*.json",
    "data/break_rules/en/*.json",
    "data/break_rules/en/*.json.gz",
    "data/break_rules/en/LICENSE",
    "data/break_rules/en/NOTICE",
    "data/unit_surfaces/*.tsv",
    "data/cldr_symbols/*.tsv",
    "data/cldr_symbols/LICENSE",
    "data/ucd_name_aliases/*.tsv",
    "data/ucd_name_aliases/LICENSE",
    "data/PROVENANCE.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Print each test's time beside it, in run order (per-test times need -v).
console_output_style = "times"
addopts = "-v"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests and the docs generator don't need postponed-annotation semantics.
"tests/**" = ["I002"]
"docs/**" = ["I002"]
