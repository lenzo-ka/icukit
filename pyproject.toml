[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icukit"
dynamic = ["version"]
description = "ICU toolkit - library and CLI for Unicode and internationalization"
authors = [
    {name = "Kevin Lenzo", email = "kevinlenzo@gmail.com"}
]
license = {text = "BSD-2-Clause"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["icu", "unicode", "i18n", "internationalization", "localization", "text", "collation", "formatting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
]
# icukit-pyicu bundles pre-built ICU libraries and PyICU, and now ships
# manylinux wheels as well as macOS wheels, so it is the single default
# backend on every supported platform. Both it and system PyICU provide the
# same importable `icu` module.
dependencies = [
    "icukit-pyicu>=78.3.0",
]

[project.urls]
Homepage = "https://github.com/lenzo-ka/icukit"
Repository = "https://github.com/lenzo-ka/icukit"
Issues = "https://github.com/lenzo-ka/icukit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
    # Used only by the test suite to validate authored abbreviation lexicons
    # against their RELAX NG grammar. The runtime loader stays lxml-free.
    "lxml>=5.0",
]

[project.scripts]
icukit = "icukit.cli:main"
ik = "icukit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "icukit.__version__"}

[tool.setuptools.packages.find]
include = ["icukit*"]
exclude = ["eval*"]

[tool.setuptools.package-data]
icukit = ["py.typed", "data/abbreviations/*.xml", "data/abbreviations/*.rng"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests and the docs generator don't need postponed-annotation semantics.
"tests/**" = ["I002"]
"docs/**" = ["I002"]
