name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A new push to a pull request cancels its older run; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.16.3

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Pull requests run a slim pair (newest Python on Linux, oldest on macOS);
      # main, manual runs and pull requests labeled `full-ci` run the full matrix.
      # 3.14 is intentionally omitted: PyICU segfaults there (see commit 3f5b034).
      # Restore it here and re-add its classifier in pyproject.toml once fixed.
      matrix:
        include: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '[{"os":"ubuntu-24.04","python-version":"3.11"},{"os":"ubuntu-24.04","python-version":"3.12"},{"os":"ubuntu-24.04","python-version":"3.13"},{"os":"macos-14","python-version":"3.11"},{"os":"macos-14","python-version":"3.12"},{"os":"macos-14","python-version":"3.13"}]' || '[{"os":"ubuntu-24.04","python-version":"3.13"},{"os":"macos-14","python-version":"3.11"}]') }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  tiergraph-integration:
    # The normal `test` job covers the released tiergraph version users receive.
    # This separate integration is an upstream canary: it installs tiergraph from
    # the sibling repository's main branch to detect compatibility breaks early.
    # It runs on main, manual runs and pull requests labeled `full-ci`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Check out tiergraph upstream canary (sibling, editable)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: lenzo-ka/tiergraph
          path: _tiergraph

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ./_tiergraph
          pip install -e .

      - name: Run H1 integration tests
        run: python -m pytest tests/test_tiergraph_text_example.py -v

  docs-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check docs are up to date
        run: python docs/generate.py --check
